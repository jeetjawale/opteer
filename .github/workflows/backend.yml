name: Backend Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opteer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-test.txt
        pip install ruff black mypy pytest-cov pip-audit

    - name: Security Scan (pip-audit)
      run: pip-audit --ignore-vuln CVE-2025-46656 --ignore-vuln PYSEC-2026-196 --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357

    - name: Check formatting with Black
      run: black --check app

    - name: Lint with Ruff
      run: ruff check app

    - name: Type checking with MyPy
      run: mypy app

    - name: Check DB Migrations (Alembic)
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/opteer_test
        API_KEY_ENCRYPTION_KEY: Z_ILOz5AOX7jBQ3cIveKBpeaAxB-pOlmixGsxuy-ii8=
      run: |
        alembic upgrade head
        alembic check

    - name: Run tests and coverage
      env:
        AI_PROVIDER: mock
        API_KEY_ENCRYPTION_KEY: Z_ILOz5AOX7jBQ3cIveKBpeaAxB-pOlmixGsxuy-ii8=
        PYTHONPATH: .
      run: |
        pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=70
