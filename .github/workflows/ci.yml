name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff black mypy pytest-cov

    - name: Check formatting with Black
      run: black --check app

    - name: Lint with Ruff
      run: ruff check app

    - name: Type checking with MyPy
      run: mypy app
      continue-on-error: true

    - name: Run tests and coverage
      env:
        AI_PROVIDER: mock
        API_KEY_ENCRYPTION_KEY: Z_ILOz5AOX7jBQ3cIveKBpeaAxB-pOlmixGsxuy-ii8=
        CLERK_SECRET_KEY: mockclerksecret
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: mockclerkpub
      run: |
        pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=70

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type-check
      run: npm run type-check

    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8085
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_mock
        CLERK_SECRET_KEY: sk_test_mock
