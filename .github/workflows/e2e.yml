name: E2E Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci
        npx playwright install --with-deps

    - name: Run Docker Compose Stack
      env:
        # Mock API Key for tests
        API_KEY_ENCRYPTION_KEY: Z_ILOz5AOX7jBQ3cIveKBpeaAxB-pOlmixGsxuy-ii8=
        AI_PROVIDER: mock
      run: |
        docker compose up -d --build
        # Wait for the backend health check to pass
        echo "Waiting for backend to be healthy..."
        timeout 180s bash -c 'until curl -s http://localhost:8080/health; do sleep 2; done'
        echo "Backend is up!"

    - name: Run Playwright Tests
      run: |
        cd frontend
        npx playwright test tests/e2e/fullstack/

    - name: Docker Logs on Failure
      if: failure()
      run: docker compose logs

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 7
