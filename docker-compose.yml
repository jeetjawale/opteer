# =============================================================================
# Opteer - Docker Compose Configuration
# =============================================================================
# Single-command setup: docker compose up --build
# No local Python, Node.js, or PostgreSQL required.
# =============================================================================

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opteer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/opteer
      - API_KEY_ENCRYPTION_KEY=EI-hCh7RMRnfAQWb0TFpHgEvPEqUJPQp0cv_pnDVCuE=
      - ENVIRONMENT=development
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=["http://localhost:3000"]
      - AI_PROVIDER=${AI_PROVIDER:-}
      - LOG_LEVEL=INFO
    volumes:
      - local_storage:/app/local_storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - INTERNAL_API_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  local_storage:
